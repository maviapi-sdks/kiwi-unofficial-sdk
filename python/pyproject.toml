[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-unofficial-sdk"
version = "0.1.0"
description = "Unofficial Kiwi.com API client"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["kiwi", "kiwi-api", "unofficial", "sdk", "maviapi"]

[project.urls]
Homepage = "https://maviapi.com/apis/kiwi"
Repository = "https://github.com/maviapi-sdks/kiwi-unofficial-sdk"

[tool.setuptools]
packages = ["kiwi_sdk"]
